name: audit

# Known advisories against what the site runs, once a week, by hand, and on a pull request that changes the
# dependencies. Kept apart from the checks on purpose: a change proposed through the room cannot touch the
# dependencies (scripts/proposal-rules.mjs), so an advisory published overnight must not turn its checks red.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths: [package.json, pnpm-lock.yaml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The same pinned actions as checks (.github/workflows/ci.yml); the comment names the release.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/action-setup v6.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
