name: checks

# Runs on every pull request, including ones from forks and from the room. It uses no secrets and a read-only
# token, so a pull request cannot reach anything by changing what runs here; only maintainers change this file.
# workflow_dispatch is how the proposals job starts these checks on a branch it has just opened as a pull request:
# GitHub does not start them by itself for a pull request that a job opened.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rally
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rally
    steps:
      # Actions are pinned to exact commits; the comment names the release.
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/action-setup v6.1.0 (reads the pnpm version from package.json packageManager)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Both build the card from src/room-ui first; it is not committed.
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply the schema
        run: pnpm db:apply
      - run: npx playwright install --with-deps chromium
      - name: Browser tests against a production build
        run: pnpm test:e2e
        env:
          E2E_PROD: '1'
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
